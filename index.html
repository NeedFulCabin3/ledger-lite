<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Budget Tracker</h1>
        
        <div class="balance-card">
            <h2>Net Balance</h2>
            <div id="balance" class="balance-amount">₹0.00</div>
            <div class="stats">
                <div>
                    <small>Income</small>
                    <p id="total-income" class="money plus">+₹0.00</p>
                </div>
                <div>
                    <small>Expenses</small>
                    <p id="total-expense" class="money minus">-₹0.00</p>
                </div>
            </div>
        </div>

        <h3>Add New Transaction</h3>
        <form id="transaction-form">
            <div class="form-group">
                <label for="text">Description</label>
                <input type="text" id="text" placeholder="e.g., Groceries, Salary" required />
            </div>
            <div class="form-group">
                <label for="amount">Amount (Negative = Expense, Positive = Income)</label>
                <input type="number" step="0.01" id="amount" placeholder="e.g., -500, 15000" required />
            </div>
            <button class="btn">Add Transaction</button>
        </form>

        <h3>History</h3>
        <ul id="transaction-list" class="list"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
